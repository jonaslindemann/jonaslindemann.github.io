[project]
site_name = "Coding thoughts"
site_description = "Development notes about C++, Python, Fortran, HPC, mechanics, and graphics."
site_author = "Jonas Lindemann"
site_url = "https://jonaslindemann.github.io/"
copyright = "Copyright &copy; Jonas Lindemann"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Blog" = "blog/index.md" },
  { "Links" = [
    { "General" = "gen-links.md" },
    { "Videos" = "yt-links.md" },
    { "Projects" = "gh-links.md" },
  ] },
]

[project.theme]
variant = "classic"
custom_dir = "overrides"
features = [
  "header.autohide",
  "navigation.instant",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.font]
text = "Noto Sans Display"
code = "Ubuntu Mono"

[project.theme.icon]
logo = "fontawesome/solid/code-compare"

[[project.theme.palette]]
scheme = "slate"
primary = "yellow"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://twitter.com/jonas_lindemann"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/jonas-lindemann-8632343/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jonaslindemann"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://www.youtube.com/@JonasLindemann"

[project.extra.analytics]
provider = "plausible"
domain = "jonaslindemann.github.io"

[project.plugins.search]
separator = '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

[project.markdown_extensions.meta]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
